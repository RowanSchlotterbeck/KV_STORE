# Example static cluster config for kv_server --cluster <file> --node-id <id>.
#
#   <node_id> <host> <peer_port> [<client_port>]
#
# List every node, including the one being started. peer_port is the
# node-to-node RPC port. client_port (optional) is the node's client line
# protocol port: followers redirect clients to the leader's, and a node
# started without --client-port listens on its own.
# Node ids are nonzero decimal numbers; '#' starts a comment.

1 127.0.0.1 6001 5551
2 127.0.0.1 6002 5552
3 127.0.0.1 6003 5553
