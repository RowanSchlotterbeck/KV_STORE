# Example static cluster config for kv_server --cluster <file> --node-id <id>.
#
#   <node_id> <host> <peer_port>
#
# List every node, including the one being started. peer_port is the
# node-to-node RPC port; the client line protocol stays on 5555.
# Node ids are nonzero decimal numbers; '#' starts a comment.

1 127.0.0.1 6001
2 127.0.0.1 6002
3 127.0.0.1 6003
