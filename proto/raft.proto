syntax = "proto3";

package kvstore;

// Raft peer RPC messages (Raft paper, Figure 2). Log entries reuse the same
// LogEntry message the persistent log stores, so there is one definition.
import "kvstore.proto";

// Node ids are uint64: fixed-size and cheap to compare. A peer's network
// address is configuration, mapped from its id by the transport.

message RequestVoteRequest {
  uint64 term = 1;            // candidate's term
  uint64 candidate_id = 2;    // candidate requesting the vote
  uint64 last_log_index = 3;  // index of candidate's last log entry
  uint64 last_log_term = 4;   // term of candidate's last log entry
}

message RequestVoteResponse {
  uint64 term = 1;            // current term, for the candidate to update itself
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;            // leader's term
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;  // index of the entry immediately preceding `entries`
  uint64 prev_log_term = 4;   // term of that entry
  repeated LogEntry entries = 5;  // empty for a heartbeat
  uint64 leader_commit = 6;   // leader's commit index
}

message AppendEntriesResponse {
  uint64 term = 1;            // current term, for the leader to update itself
  bool success = 2;           // follower had an entry matching prev_log_index/term
}
